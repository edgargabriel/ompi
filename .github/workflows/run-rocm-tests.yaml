name: ROCM

on: [pull_request]

permissions:
  contents: read

jobs:
  compile-rocm:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build Open MPI
      run: |
        export AUTOMAKE_JOBS=$(nproc)
        ./autogen.pl
        ./configure --prefix=${PWD}/install --with-rocm=/opt/rocm --disable-mpi-fortran --disable-silent-rules
        LD_LIBRARY_PATH=/opt/rocm/lib make -j

name: Run-ROCM

on: [pull_request]

permissions:
  contents: read

jobs:
  compile-rocm:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build Open MPI
      run: |
        export AUTOMAKE_JOBS=$(nproc)
        ./autogen.pl
        ./configure --prefix=${GITHUB_WORKSPACE}/install --with-rocm=/opt/rocm --disable-mpi-fortran --disable-silent-rules --with-hwloc=internal --with-prrte=internal --with-pmix=internal --with-libevent=internal
        LD_LIBRARY_PATH=/opt/rocm/lib make -j
    - name: Build hip-mpi-testsuite
      run: |
        git clone https://github.com/ROCm/hip-mpi-testsuite
        cd hip-mpi-testsuite
        export PATH=${GITHUB_WORKSPACE}/install/bin:$PATH
        export LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/install/lib:$LD_LIBRARY_PATH
        ./configure CXX=mpiCC --with-rocm=/opt/rocm
        make -j$(nproc)
        pwd
    - name: Build hip-mpi-testsuite no UCX
      run: |
        cd hip-mpi-testsuite
        pwd
        export PATH=${GITHUB_WORKSPACE}/install/bin:$PATH
        export LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/install/lib:$LD_LIBRARY_PATH
        ./scripts/run_all_no_ucx.sh

